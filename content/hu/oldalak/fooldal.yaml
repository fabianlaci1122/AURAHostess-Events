        szoveg: "pontos cím, bejárat, pult"
      - cim: "Idő"
        szoveg: "érkezés, kezdés, zárás"
      - cim: "Feladat"
        szoveg: "ki mit csinál, hol áll"
      - cim: "Öltözet"
        szoveg: "ahogy Önnel egyeztettük"
